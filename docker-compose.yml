# Start:  docker compose up --build
# Scale:  docker compose up -d --scale booking-service=3
x-service: &svc
  restart: on-failure
  depends_on:
    postgres: { condition: service_healthy }
    eureka-server: { condition: service_started }
  environment: &svc-env
    SPRING_PROFILES_ACTIVE: docker
    SERVER_PORT: "8080"
    EUREKA_URL: http://eureka-server:8761/eureka
    DB_HOST: postgres
    JWT_SECRET: ${JWT_SECRET:-precisionauto-dev-secret-key-change-in-prod-32b}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  eureka-server:
    build: { context: ., args: { MODULE: eureka-server } }
    ports: ["8761:8761"]

  auth-service:
    <<: *svc
    build: { context: ., args: { MODULE: auth-service } }

  booking-service:
    <<: *svc
    build: { context: ., args: { MODULE: booking-service } }
    deploy:
      replicas: 2          # two instances -> gateway/RestClient round-robin via Eureka

  record-service:
    <<: *svc
    build: { context: ., args: { MODULE: record-service } }
    deploy:
      replicas: 2

  billing-service:
    <<: *svc
    build: { context: ., args: { MODULE: billing-service } }

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    restart: on-failure
    depends_on: [eureka-server]
    ports: ["8080:8080"]
    environment:
      SERVER_PORT: "8080"
      EUREKA_URL: http://eureka-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-precisionauto-dev-secret-key-change-in-prod-32b}

volumes:
  pgdata:
